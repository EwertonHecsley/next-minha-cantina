version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cantina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cantina_user
      POSTGRES_PASSWORD: cantina_pass
      POSTGRES_DB: cantina_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
